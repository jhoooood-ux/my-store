<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر النخبة الرياضي - تواصل معنا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">متجر النخبة</div>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="products.html">المنتجات</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">تواصل معنا</h2>
        <div class="contact-form">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">الاسم الكامل:</label>
                    <input type="text" id="name" name="name" required placeholder="أدخل اسمك...">
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label for="message">رسالتك أو استفسارك:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="اكتب رسالتك هنا..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">إرسال الرسالة</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع حقوق الطبع والنشر محفوظة &copy; 2026 متجر النخبة الرياضي</p>
    </footer>

</body>
</html>
